name: Flutter CI/CD

on:
  push:
    branches: [ main_real, 3 ]
  pull_request:
    branches: [ main_real, 3 ]

env:
  FLUTTER_VERSION: '3.35.2'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-key: flutter-${{ env.FLUTTER_VERSION }}
        cache-path: ${{ github.workspace }}/.pub-cache

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

    # - name: Run tests
    #   run: flutter test

    # - name: Verify formatting
    #   run: flutter format .

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Build Android APK
      run: flutter build apk --release
      env:
        NAKAMA_SERVER_KEY: ${{ secrets.NAKAMA_SERVER_KEY }}
        NAKAMA_HOST: ${{ secrets.NAKAMA_HOST }}

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7

  build-web:
    name: Build Web Version
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Build Web
      run: flutter build web --release
      env:
        NAKAMA_SERVER_KEY: ${{ secrets.NAKAMA_SERVER_KEY }}
        NAKAMA_HOST: ${{ secrets.NAKAMA_HOST }}

    - name: Upload Web artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: build/web
        retention-days: 7
